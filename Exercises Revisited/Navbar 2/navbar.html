<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');

        * {
            margin: 0;
            padding: 0;
        }

        .container{
            font-family: "Google Sans", sans-serif;
            height: 8.5vh;
            margin: 10px 60px;
            border: 1px solid lightslategrey;
            border-radius: 5px;
            display: flex;
            gap: 230px;
            justify-content: center;
        }

        .desc , .other{
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .topic{
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 1000;
        }

        .image img{
            height: 40px;
        }

        .image1 img{
            height: 20px;
        }

        .download{
            border: 2px solid gold;
            padding: 8px 20px;
            background-color: gold;
            border-radius: 5px;
        }

        .desc , .rest{
            font-weight: 500;
            font-size: 0.9em;
        }

        .other{
            margin-right: 15px;
        }
        
    </style>
</head>

<body>
    <div class="container">

        <div class="topic">
            <div class="image">
                <img src="images.jpg" alt="">
            </div>
            <div class="head">UltraEdit</div>
        </div>

        <div class="desc">
            <div class="item">Products</div>
            <div class="item">Buy</div>
            <div class="item">Renew</div>
            <div class="item">Support</div>
            <div class="item">Learn</div>
            <div class="item">Company</div>
        </div>

        <div class="other">
            <div class="rest download">Download</div>
            <div class="rest">English</div>
            <div class="image1">
                <img src="images1.png" alt="">
            </div>
        </div>

    </div>
    </div>
</body>

</html>
