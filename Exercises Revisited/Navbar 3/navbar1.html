<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style-type: none;
            align-items: center;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-content: center;
            border: 0.3px solid #333;
            margin: 0 55px;
            background-color: rgb(246 246 246);
            gap: 185px;
            border-radius: 5px;
            font-family: Inter, Helvetica, Arial, Lucida, sans-serif;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
        }

        .one , .two {
            display: flex;
            gap: 20px;
        }

        .heading img {
            height: 34px;
        }

        .heading  {
            align-self: center;
        }

    </style>

</head>

<body>
    <header>
        <nav>
            <div class="heading">
                <img src="	https://www.ultraedit.com/wp-content/uploads/2023/01/UE_primary_logo.png" alt="">
            </div>

            <ul class="one">
                <li><span>Products</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M6 9L11.2929 14.2929C11.6262 14.6262 11.7929 14.7929 12 14.7929C12.2071 14.7929 12.3738 14.6262 12.7071 14.2929L18 9"
                            stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg></li>
                <li><span>Buy</span></li>
                <li><span>Renew</span></li>
                <li><span>Support</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M6 9L11.2929 14.2929C11.6262 14.6262 11.7929 14.7929 12 14.7929C12.2071 14.7929 12.3738 14.6262 12.7071 14.2929L18 9"
                            stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg></li>
                <li><span>Learn</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M6 9L11.2929 14.2929C11.6262 14.6262 11.7929 14.7929 12 14.7929C12.2071 14.7929 12.3738 14.6262 12.7071 14.2929L18 9"
                            stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg></li>
                <li><span>Company</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M6 9L11.2929 14.2929C11.6262 14.6262 11.7929 14.7929 12 14.7929C12.2071 14.7929 12.3738 14.6262 12.7071 14.2929L18 9"
                            stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg></li>
            </ul>

            <ul class="two">
                <li>Download</li><i class="hgi hgi-stroke hgi-rounded hgi-arrow-down-01"></i>
                <li>English</li><i class="hgi hgi-stroke hgi-rounded hgi-arrow-down-01"></i>
                <div class="image"></div>
            </ul>
        </nav>
    </header>
</body>

</html>
