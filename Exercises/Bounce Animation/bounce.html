<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        .box {
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: ver-anim 0.5s cubic-bezier(0, 0, 0.13, 0.96) 0s infinite alternate , hor-anim 4s linear 0s infinite ;
        }
               
        @keyframes hor-anim {
            from{}
            to{
                transform: translate(80vw);
            }
        }
        
        @keyframes ver-anim{
            from{}
            to{
                transform: translateY(-200px);
            }
        }
        
        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }
    </style>

</head>

<body>
    <div class="container">

        <div class="box">
        </div>
    </div>
    <!-- 
   
     -->
</body>

</html>
