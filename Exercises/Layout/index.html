<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        
        * {
            margin: 0;
            padding: 0;
        }

        /* 
            takeaway : 
            header pe pos-sticky lagana 
            in a website , header contain multiple things containing images ....etc

            if we made only nav as sticky , it will apply but not for other things inside the header

            so that's why , i applied pos-sticky in the header section
        */

        header{
            position: sticky;
            top: 0;
        }
        
        nav {
            background-color: rgb(232, 123, 141);
            height: 10vh;
        }

        main{
            background-color: black;
            color: rgb(255, 255, 255);
            padding: 50px;
        }

        .content {
            height: 80vh;
            background-color: greenyellow;
            padding: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* padding: 40px; */
            margin: 40px 40px 0 44px;
        }

        .box1 {
            height: 60vh;
            width: 45%;
            background-color: rgb(216, 107, 230);
            margin: 75px;
        }

        .box2 {
            height: 60vh;
            width: 45%;
            background-color: rgb(112, 112, 246);
            margin: 75px;
        }

        .circle {
            /* border: 2px solid black;
            float: right;
            position: relative;
            top: -60px;
            left: -70px;
            background-color: blue; */
            height: 50px;
            width: 50px;
            border-radius: 50px;
            position: fixed;
            bottom: 12px;
            right: 23px;
            background: orange;

            /*  takeaway : 

                use the properties like top , bottom , left and right in css to position this circle or anything
            */
        }

        .swdc {
            border: 2px solid rgb(254, 254, 254);
            border-radius: 50px;
            padding: 60px;
            text-align: center;
            margin: 50px 19vw;
            font-size: 2rem;
        }

        footer {
            height: 10vh;
            background-color: rgb(8, 193, 235);
        }

    </style>
</head>

<body>
    <header>
        <nav></nav>
    </header>

    <main>
        <div class="content">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="circle"></div>
    
        <div class="swdc">
            <p>
                Welcome to Sigma Web dev express
            </p>
        </div>
    </main>


    <footer></footer>

</body>

</html>
